name: Vector-PL-Release

on:
  workflow_dispatch:
  push:
    branches: [ PL ]
    tags: [ 2.0 ]
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Write key
        if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/PL' ) || github.ref_type == 'tag' }}
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
            echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
            echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
            echo androidStoreFile='key.jks' >> gradle.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk-bundle'

      - name: Install latest system Ninja and force override SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          
          # Brutalne nadpisanie starego ninja w Android SDK najnowszą wersją systemową
          NINJA_SYSTEM_PATH=$(which ninja)
          SDK_NINJA_PATH="/usr/local/lib/android/sdk/cmake/3.31.5/bin/ninja"
          
          if [ -f "$SDK_NINJA_PATH" ]; then
            rm "$SDK_NINJA_PATH"
            ln -s "$NINJA_SYSTEM_PATH" "$SDK_NINJA_PATH"
            echo "Sukces: Nadpisano Ninja w SDK wersją systemową."
          else
            # Jeśli ścieżka się różni, tworzymy folder i link na zapas
            mkdir -p "$(dirname "$SDK_NINJA_PATH")"
            ln -s "$NINJA_SYSTEM_PATH" "$SDK_NINJA_PATH"
            echo "Utworzono link awaryjny dla Ninja w SDK."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Gradle properties
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Build
        run: ./gradlew zipAll

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.0
          name: Release
          files: |
            zygisk/release/Vector-PL-2.0.3043-Release.zip
            zygisk/release/Vector-PL-2.0.3043-Debug.zip
          force: true